<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Door Animator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #111827; /* Dark gray to match ambient shadow */
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        /* Status text is still written by the script but never shown */
        #status-message { display: none; }

        #svg-container {
            position: fixed;
            inset: 0;
            background: #000; /* Fallback background for the wall */
            /* perspective and perspective-origin are set by layout() to suit the door */
        }

        #svg-container svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /*
         * The door lives in its own transparent <svg> layered exactly over the scene, and that
         * HTML element is what rotates. Browsers render 3D transforms on HTML elements
         * consistently; on shapes inside an SVG the settled state renders differently from the
         * in-flight one.
         */
        .door-layer {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d; /* Lets the edge face sit at its own angle in 3D */
            pointer-events: none; /* Clicks fall through to the scene except on the door itself */
            transform: rotateY(0deg);
            transition: transform 2.5s ease-in-out;
        }

        #svg-container.open .door-layer {
            transform: rotateY(85deg);
        }

        .door-layer svg {
            position: absolute;
            inset: 0;
        }

        .door-edge {
            position: absolute;
            transform-origin: 0 0;
            pointer-events: auto;
            cursor: pointer;
            background: linear-gradient(to right, #b3000f, #7d000a);
            box-shadow: inset 0 0 0 1px #020101;
        }

        /* Clicking the door or its frame toggles it open/closed; a click mid-swing reverses it */
        .door {
            cursor: pointer;
            pointer-events: visiblePainted;
        }

        .door-frame {
            cursor: pointer;
        }

        /* Light that only shows while the door is open, fading in as it swings */
        .light-open {
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }

        #svg-container.open .light-open {
            opacity: 1;
        }

        .light {
            pointer-events: none;
        }

        /* The doorway is slightly larger than the door, so hide it while closed: it appears
           as soon as the door starts to open, and only goes away once the door is shut again */
        .doorway {
            opacity: 0;
            transition: opacity 0.3s ease 2.2s;
        }

        #svg-container.open .doorway {
            opacity: 1;
            transition: opacity 0.2s ease;
        }

        .flicker {
            animation: flicker 2.3s steps(1) infinite;
        }

        .strobe {
            animation: flicker 0.9s steps(1) infinite;
        }

        @keyframes flicker {
            0%   { opacity: 1; }
            12%  { opacity: 0.55; }
            18%  { opacity: 0.95; }
            33%  { opacity: 0.4; }
            41%  { opacity: 1; }
            57%  { opacity: 0.7; }
            63%  { opacity: 0.25; }
            70%  { opacity: 0.9; }
            86%  { opacity: 0.6; }
            93%  { opacity: 1; }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const svgContainer = document.getElementById('svg-container');
            const statusMsg = document.getElementById('status-message');
            const fileInput = document.getElementById('file-input');
            
            let doorGroup = null;

            // Helper to deeply check if a color is reddish
            function isColorRed(colorStr) {
                if (!colorStr || colorStr === 'none' || colorStr === 'transparent') return false;
                const s = colorStr.toLowerCase();
                
                // Fast path for exact keyword matches
                if (s.includes('red') || s.includes('#ff0000') || s.includes('#f00')) return true;

                // Compute exact RGB values for arbitrary colors
                const dummy = document.createElement('div');
                dummy.style.color = colorStr;
                document.body.appendChild(dummy);
                const rgb = window.getComputedStyle(dummy).color;
                document.body.removeChild(dummy);

                const match = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
                if (match) {
                    const r = parseInt(match[1]);
                    const g = parseInt(match[2]);
                    const b = parseInt(match[3]);
                    // Heuristic: High Red channel, low Green/Blue channels
                    if (r > 120 && g < 80 && b < 80) return true;
                }
                return false;
            }

            const FLOOR_COLOR = '#c4c4c4';  // Light gray foreground
            const MAX_DOOR_PX = 250;        // Door never renders taller than this
            const EXTEND = 20000;           // How far (in SVG units) wall and floor run past the art
            let doorHeightUnits = 268;      // Replaced with the measured door height once detected
            let sceneBox = null;            // Original viewBox: { x, y, w, h }
            let floorLine = null;           // Two points on the floor's top edge (for its slope)

            // Point on the line through a and b at the given x
            function lineY(a, b, x) {
                return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
            }

            function polygonPoints(poly) {
                return poly.getAttribute('points').trim().split(/[\s,]+/).map(Number)
                    .reduce((pts, v, i, arr) => (i % 2 ? pts : [...pts, [v, arr[i + 1]]]), []);
            }

            // Recolor the floor and stretch the wall and floor far past the art so that
            // whatever the viewBox shows beyond the original edges is still scene.
            function extendScene(svg) {
                const [vx, vy, vw, vh] = svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
                sceneBox = { x: vx, y: vy, w: vw, h: vh };
                const L = vx - EXTEND, R = vx + vw + EXTEND;
                const T = vy - EXTEND, B = vy + vh + EXTEND;
                const fmt = pts => pts.map(p => p.join(',')).join(' ');

                const floor = svg.querySelector('#Layer_2-2 > polygon');
                if (floor) {
                    // Top edge runs from the first point (left) to the second (right)
                    const [a, b] = polygonPoints(floor);
                    floorLine = [a, b];
                    floor.setAttribute('points', fmt([[L, lineY(a, b, L)], [R, lineY(a, b, R)], [R, B], [L, B]]));
                    floor.style.fill = FLOOR_COLOR;
                }

                const wall = svg.querySelector('#Layer_1-2 > polygon');
                if (wall) {
                    // Bottom edge runs from the bottom-right corner (4th point) to the bottom-left (1st)
                    const pts = polygonPoints(wall);
                    const a = pts[0], b = pts[3];
                    wall.setAttribute('points', fmt([[L, T], [R, T], [R, lineY(a, b, R) + 6], [L, lineY(a, b, L) + 6]]));

                    // Continue the baseboard past both ends of the art. The art's baseboard is
                    // five bands (black, gray, black, thick gray, black); each boundary below is
                    // measured from the original render at two x positions per side, since the
                    // left and right sections sit at slightly different angles.
                    const BANDS = ['#020101', '#262523', '#020101', '#262523', '#020101'];
                    const strip = (x0, x1, xa, ya, xb, yb) => BANDS.map((color, i) => {
                        const top = [[xa, ya[i]], [xb, yb[i]]], bot = [[xa, ya[i + 1]], [xb, yb[i + 1]]];
                        const band = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                        band.setAttribute('points', fmt([[x0, lineY(...top, x0)], [x1, lineY(...top, x1)], [x1, lineY(...bot, x1)], [x0, lineY(...bot, x0)]]));
                        band.style.fill = color;
                        return band;
                    });
                    wall.after(
                        ...strip(L, 12, 12, [805, 807, 809.1, 810.9, 822.4, 824.6], 300, [768, 770, 771.9, 773.9, 785.1, 787.1]),
                        ...strip(1900, R, 520, [742, 743.4, 745.1, 746.5, 757, 758.9], 1900, [566, 567.6, 569.4, 570.6, 580.4, 581.9])
                    );
                }
            }

            // Size the viewBox to the window: cover it, but never scale the door past
            // MAX_DOOR_PX. Past that size the extended wall/floor fill the extra space,
            // with the original art kept centered.
            function layout() {
                const svg = svgContainer.querySelector('svg');
                if (!svg || !sceneBox) return;
                const vw = window.innerWidth, vh = window.innerHeight;
                const scale = Math.min(Math.max(vw / sceneBox.w, vh / sceneBox.h), MAX_DOOR_PX / doorHeightUnits);
                const w = vw / scale, h = vh / scale;
                const cx = sceneBox.x + sceneBox.w / 2, cy = sceneBox.y + sceneBox.h / 2;
                const viewBox = `${cx - w / 2} ${cy - h / 2} ${w} ${h}`;
                svgContainer.querySelectorAll('svg').forEach(s => s.setAttribute('viewBox', viewBox));

                if (doorLayer && doorHinge) {
                    // Hinge and perspective in screen pixels, so the swing looks the same at any size
                    const hx = (doorHinge[0] - (cx - w / 2)) * scale, hy = (doorHinge[1] - (cy - h / 2)) * scale;
                    const doorPx = doorHeightUnits * scale;
                    doorLayer.style.transformOrigin = `${hx}px ${hy}px`;
                    svgContainer.style.perspective = `${doorPx * 4}px`;
                    svgContainer.style.perspectiveOrigin = `${hx - doorPx * 0.2}px ${hy}px`;

                    if (doorEdge && doorEdgeFace) {
                        const toPx = ([x, y]) => [(x - (cx - w / 2)) * scale, (y - (cy - h / 2)) * scale];
                        const [top, bottom] = doorEdge.map(toPx);
                        const tilt = Math.atan2(bottom[0] - top[0], bottom[1] - top[1]) * 180 / Math.PI;
                        Object.assign(doorEdgeFace.style, {
                            left: `${top[0]}px`,
                            top: `${top[1]}px`,
                            width: `${DOOR_THICKNESS * scale}px`,
                            height: `${Math.hypot(bottom[0] - top[0], bottom[1] - top[1])}px`,
                            // Follow the panel's slanted edge, then turn back into the doorway
                            transform: `rotateZ(${-tilt}deg) rotateY(90deg)`,
                        });
                    }
                }
            }

            window.addEventListener('resize', layout);

            const SVG_NS = 'http://www.w3.org/2000/svg';
            const LIGHT_COLORS = '#ff2bd6;#00e5ff;#7cff00;#ffd400;#7a2bff;#ff2bd6';

            // Perspective of the floor, estimated from the art: lines along the wall converge at
            // VP_WALL (where the door's top and bottom edges meet); lines running straight out
            // from the wall converge at VP_OUT, further off to the left on the same horizon.
            const VP_WALL = [1928, 576];
            const VP_OUT = [-1200, 576];

            // Inner edge of the white door frame in the art: the opening revealed as the door swings
            const DOORWAY = [[380.98, 520.12], [490.4, 524.04], [488.68, 759.91], [398.89, 771.8]];

            const DOOR_THICKNESS = 6; // SVG units (~5% of the door's width)

            let doorLayer = null;     // Group holding the door's <svg> and edge face, rotated in 3D
            let doorHinge = null;     // Hinge point (door's right edge, mid-height) in SVG units
            let doorEdge = null;      // Free (left) edge of the door panel: [top, bottom] in SVG units
            let doorEdgeFace = null;  // The element drawn as the door's thickness

            // Top-left and bottom-left corners of the red door panel
            function doorLeftEdge(door) {
                const panel = Array.from(door.querySelectorAll('polygon'))
                    .filter(el => isColorRed(window.getComputedStyle(el).fill))
                    .sort((p, q) => {
                        const pb = p.getBBox(), qb = q.getBBox();
                        return qb.width * qb.height - pb.width * pb.height;
                    })[0];
                if (panel) {
                    const corners = polygonPoints(panel);
                    const top = corners.reduce((m, p) => (p[0] + p[1] < m[0] + m[1] ? p : m));
                    const bottom = corners.reduce((m, p) => (p[1] - p[0] > m[1] - m[0] ? p : m));
                    return [top, bottom];
                }
                const box = door.getBBox();
                return [[box.x, box.y], [box.x, box.y + box.height]];
            }

            function el(tag, attrs, parent) {
                const node = document.createElementNS(SVG_NS, tag);
                Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
                if (parent) parent.appendChild(node);
                return node;
            }

            const pts = list => list.map(p => p.join(',')).join(' ');

            // Clicking the door or its frame toggles it open/closed
            function armDoor(door) {
                const svg = door.ownerSVGElement;
                const box = door.getBBox();

                // The frame is the light-gray polygon around the door
                const frame = Array.from(svg.querySelectorAll('polygon, path'))
                    .find(el => window.getComputedStyle(el).fill === 'rgb(226, 228, 227)');
                if (frame) frame.classList.add('door-frame');

                addDoorLight(svg, door);

                // Move the door into its own layer over the scene (same size and viewBox)
                doorEdge = doorLeftEdge(door);
                doorLayer = document.createElement('div');
                doorLayer.className = 'door-layer';
                const doorSvg = svg.cloneNode(false);
                doorSvg.removeAttribute('id');
                doorSvg.appendChild(door);
                doorLayer.appendChild(doorSvg);
                // The door's swinging edge: a strip turned 90° back into the doorway, so it
                // shows as the door's thickness once the door turns
                doorEdgeFace = document.createElement('div');
                doorEdgeFace.className = 'door-edge';
                doorLayer.appendChild(doorEdgeFace);
                svgContainer.appendChild(doorLayer);
                door.classList.add('door');
                doorHinge = [box.x + box.width, box.y + box.height / 2];

                const toggle = () => svgContainer.classList.toggle('open');
                door.addEventListener('click', toggle);
                doorEdgeFace.addEventListener('click', toggle);
                if (frame) frame.addEventListener('click', toggle);
                layout();
            }

            // Bottom-left and bottom-right corners of the red door panel (the largest red shape)
            function doorBottom(door, slope) {
                const panel = Array.from(door.querySelectorAll('path, rect, polygon'))
                    .filter(el => isColorRed(window.getComputedStyle(el).fill))
                    .sort((p, q) => {
                        const pb = p.getBBox(), qb = q.getBBox();
                        return qb.width * qb.height - pb.width * pb.height;
                    })[0];
                if (panel && panel.tagName === 'polygon') {
                    // The two points furthest below a line parallel to the floor
                    const [p, q] = polygonPoints(panel).sort((u, v) => (v[1] - slope * v[0]) - (u[1] - slope * u[0]));
                    return p[0] < q[0] ? [p, q] : [q, p];
                }
                const box = (panel || door).getBBox();
                const y = box.y + box.height;
                return [[box.x, y], [box.x + box.width, y + slope * box.width]];
            }

            // Vertical-ish gradient whose stops all cycle through the light-show colors
            function cyclingGradient(defs, id, from, to, stops) {
                const grad = el('linearGradient', {
                    id, gradientUnits: 'userSpaceOnUse', x1: from[0], y1: from[1], x2: to[0], y2: to[1],
                }, defs);
                stops.forEach(([offset, opacity], i) => {
                    const stop = el('stop', { offset, 'stop-opacity': opacity }, grad);
                    // Each stop runs the same cycle slightly offset, so the light shimmers
                    el('animate', { attributeName: 'stop-color', values: LIGHT_COLORS, dur: '4s', begin: `${-i * 0.4}s`, repeatCount: 'indefinite' }, stop);
                });
            }

            // Random-walk every part of the doorway light so it never settles into a pattern
            function animateDoorway({ turbulence, hue, field, fieldRect, blobs, flash, box }) {
                const wander = (v, step, min, max) => Math.min(max, Math.max(min, v + (Math.random() - 0.5) * step));
                let fx = 0.03, fy = 0.02, hueAngle = 0, hueSpeed = 40, driftX = 0, driftY = 0, flashLevel = 0;
                let last = performance.now(), lastOpen = -Infinity;

                const frame = now => {
                    const dt = Math.min(0.05, (now - last) / 1000);
                    last = now;
                    if (!field.isConnected) return; // Scene was replaced
                    // Only animate while the doorway can be seen (open, or still fading after closing)
                    if (svgContainer.classList.contains('open')) lastOpen = now;
                    if (now - lastOpen > 3000) return requestAnimationFrame(frame);

                    // Field: wobbling scale, drifting position, hue that speeds up, stalls and reverses
                    fx = wander(fx, 0.004, 0.008, 0.06);
                    fy = wander(fy, 0.004, 0.008, 0.06);
                    turbulence.setAttribute('baseFrequency', `${fx} ${fy}`);
                    hueSpeed = wander(hueSpeed, 60, -220, 220);
                    if (Math.random() < 0.01) hueAngle += 90 + Math.random() * 180; // Sudden color jump
                    hueAngle = (hueAngle + hueSpeed * dt) % 360;
                    hue.setAttribute('values', hueAngle);
                    driftX = wander(driftX, 12, -180, 180);
                    driftY = wander(driftY, 12, -180, 180);
                    field.setAttribute('transform', `translate(${driftX} ${driftY})`);
                    fieldRect.setAttribute('x', box.x - driftX);
                    fieldRect.setAttribute('y', box.y - driftY);

                    // Blobs: jittery velocity with damping, bouncing softly off the doorway edges
                    blobs.forEach(b => {
                        b.vx = (b.vx + (Math.random() - 0.5) * 400 * dt) * 0.97;
                        b.vy = (b.vy + (Math.random() - 0.5) * 400 * dt) * 0.97;
                        b.x += b.vx * dt;
                        b.y += b.vy * dt;
                        if (b.x < box.x || b.x > box.x + box.w) b.vx *= -1;
                        if (b.y < box.y || b.y > box.y + box.h) b.vy *= -1;
                        b.r = wander(b.r, 4, 6, 45);
                        b.hue = (b.hue + (Math.random() - 0.3) * 300 * dt + 360) % 360;
                        b.node.setAttribute('cx', b.x);
                        b.node.setAttribute('cy', b.y);
                        b.node.setAttribute('rx', b.r);
                        b.node.setAttribute('ry', b.r * (0.6 + Math.random() * 0.8));
                        b.node.setAttribute('fill', `hsl(${b.hue}, 100%, 60%)`);
                    });

                    // Flashes: rare, uneven spikes that fade at varying speeds
                    if (Math.random() < 0.02) {
                        flashLevel = 0.4 + Math.random() * 0.6;
                        flash.setAttribute('fill', Math.random() < 0.5 ? '#fff' : `hsl(${Math.random() * 360}, 100%, 75%)`);
                    }
                    flashLevel *= Math.pow(0.02 + Math.random() * 0.2, dt);
                    flash.setAttribute('opacity', flashLevel);

                    requestAnimationFrame(frame);
                };
                requestAnimationFrame(frame);
            }

            // The light show: a glow from under the closed door, and when it opens, a blaze of
            // color filling the doorway, flooding the floor and blooming over the wall.
            function addDoorLight(svg, door) {
                const slope = floorLine ? (floorLine[1][1] - floorLine[0][1]) / (floorLine[1][0] - floorLine[0][0]) : 0;
                const [O, E] = doorBottom(door, slope);

                // Floor-plane coordinates -> screen: s runs along the door's bottom edge
                // (0 = left corner, 1 = right corner), t runs out from the wall toward the viewer.
                const a = (E[0] - O[0]) / (VP_WALL[0] - E[0]);
                const b = -a; // Same scale along both floor axes at the door
                const floorPoint = (s, t) => {
                    const w = 1 + a * s + b * t;
                    return [0, 1].map(i => (O[i] + a * s * VP_WALL[i] + b * t * VP_OUT[i]) / w);
                };

                const defs = svg.querySelector('defs') || svg.insertBefore(el('defs', {}), svg.firstChild);
                const blur = (id, amount) => el('feGaussianBlur', { stdDeviation: amount },
                    el('filter', { id, x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs));
                blur('light-blur', 2.5);
                blur('light-bloom', 14);

                // --- Floor: light fans out from the door, wider and fainter with distance ---
                const spill = (id, depth, fan, peak) => {
                    cyclingGradient(defs, id, floorPoint(0.5, 0), floorPoint(0.5, depth), [['0', peak], ['0.35', peak * 0.5], ['1', 0]]);
                    return el('polygon', {
                        points: pts([floorPoint(0, 0), floorPoint(1, 0), floorPoint(1 + fan, depth), floorPoint(-fan, depth)]),
                        fill: `url(#${id})`, filter: 'url(#light-blur)',
                    });
                };
                const floorLight = el('g', { class: 'light' });
                el('g', { class: 'flicker' }, floorLight).appendChild(spill('spill-closed', 2.2, 0.7, 0.95));
                // Fade (outer) and strobe (inner) on separate groups: an animation on the same
                // element would override the fade's opacity
                el('g', { class: 'strobe' }, el('g', { class: 'light-open' }, floorLight)).appendChild(spill('spill-open', 5, 1.8, 1));
                // Beneath all the door/frame/baseboard art, so only the floor itself is lit
                const art = svg.querySelector('#Generative_Object') || door;
                art.parentNode.insertBefore(floorLight, art);

                // --- Gap under the closed door: a bright sliver between the panel's bottom corners ---
                const gap = el('polygon', {
                    class: 'light flicker',
                    points: pts([[O[0], O[1] - 2], [E[0], E[1] - 2], [E[0], E[1] + 1.5], [O[0], O[1] + 1.5]]),
                });
                el('animate', { attributeName: 'fill', values: LIGHT_COLORS, dur: '4s', repeatCount: 'indefinite' }, gap);
                door.parentNode.insertBefore(gap, door);

                // --- Doorway: what's on the other side, revealed as the door swings away ---
                const xs = DOORWAY.map(p => p[0]), ys = DOORWAY.map(p => p[1]);
                const dx = Math.min(...xs), dy = Math.min(...ys), dw = Math.max(...xs) - dx, dh = Math.max(...ys) - dy;
                const cx = dx + dw / 2, cy = dy + dh * 0.55;
                el('polygon', { points: pts(DOORWAY) }, el('clipPath', { id: 'doorway-clip' }, defs));
                // Flowing color field: fractal noise pushed into saturated color. Its scale,
                // drift and hue are random-walked every frame by animateDoorway().
                // Noise is costly to render, so the filter covers only the doorway itself
                const noise = el('filter', {
                    id: 'doorway-noise', 'color-interpolation-filters': 'sRGB', x: 0, y: 0, width: 1, height: 1,
                }, defs);
                const turbulence = el('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.03 0.02', numOctaves: 2, seed: Math.floor(Math.random() * 1000) }, noise);
                el('feColorMatrix', { type: 'matrix', values: '5 -2 -2 0 -0.9  -2 5 -2 0 -0.9  -2 -2 5 0 -0.9  0 0 0 0 1' }, noise);
                const hue = el('feColorMatrix', { type: 'hueRotate', values: 0 }, noise);
                blur('blob-blur', 9);

                const doorway = el('g', { class: 'light doorway', 'clip-path': 'url(#doorway-clip)' });
                // The noise is computed in the field's own coordinates: shifting the group one way and
                // the rect back the other keeps the rect on the doorway while the noise drifts
                const field = el('g', {}, doorway);
                const fieldRect = el('rect', { x: dx, y: dy, width: dw, height: dh, filter: 'url(#doorway-noise)' }, field);
                // Soft blobs of color wandering through the field
                const blobLayer = el('g', { style: 'mix-blend-mode: screen', filter: 'url(#blob-blur)' }, doorway);
                const blobs = Array.from({ length: 7 }, () => ({
                    node: el('ellipse', {}, blobLayer),
                    x: dx + Math.random() * dw, y: dy + Math.random() * dh, vx: 0, vy: 0,
                    r: 10 + Math.random() * 25, hue: Math.random() * 360,
                }));
                // Random bursts of light washing over everything
                const flash = el('rect', { x: dx, y: dy, width: dw, height: dh, fill: '#fff', opacity: 0, style: 'mix-blend-mode: screen' }, doorway);

                animateDoorway({ turbulence, hue, field, fieldRect, blobs, flash, box: { x: dx, y: dy, w: dw, h: dh } });
                door.parentNode.insertBefore(doorway, door);

                // --- Bloom: blinding glow spilling over the frame and wall once the door opens ---
                const bloom = el('g', { class: 'light light-open', style: 'mix-blend-mode: screen' });
                const bloomShape = el('polygon', {
                    class: 'flicker',
                    points: pts(DOORWAY.map(([x, y]) => [cx + (x - cx) * 1.25, dy + dh / 2 + (y - dy - dh / 2) * 1.1])),
                    filter: 'url(#light-bloom)', opacity: 0.8,
                }, bloom);
                el('animate', { attributeName: 'fill', values: LIGHT_COLORS, dur: '4s', repeatCount: 'indefinite' }, bloomShape);
                svg.appendChild(bloom);
            }

            function setStatus(text, color) {
                statusMsg.textContent = text;
                statusMsg.className = `mb-4 text-sm font-medium ${color} h-6`;
            }

            function loadSVGText(text) {
                svgContainer.innerHTML = text;
                const svg = svgContainer.querySelector('svg');
                if (!svg) {
                    setStatus("Error: Invalid SVG file.", "text-red-500");
                    return;
                }

                svg.setAttribute('preserveAspectRatio', 'none'); // layout() matches the window's aspect exactly
                extendScene(svg);
                layout();

                // Reset any previous state
                doorGroup = null;
                doorLayer = null;
                doorEdge = null;
                doorEdgeFace = null;
                svgContainer.classList.remove('open');
                setStatus("SVG loaded. Analyzing elements...", "text-blue-400");

                // Allow browser to render SVG before calculating bounding boxes
                setTimeout(() => processSVG(svg), 100);
            }

            // Auto-load the local red-door.svg
            setStatus("Loading red-door.svg...", "text-yellow-400");
            fetch('red-door.svg')
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.text();
                })
                .then(loadSVGText)
                .catch(() => {
                    // fetch is blocked on file:// — fall back to the embedded copy
                    const embedded = document.getElementById('embedded-svg');
                    if (embedded && embedded.innerHTML.trim()) {
                        loadSVGText(embedded.innerHTML);
                    } else {
                        setStatus("Couldn't load red-door.svg — choose a file instead.", "text-red-500");
                        fileInput.className = 'fixed top-4 left-4 z-10 text-sm text-gray-300';
                    }
                });

            // Fallback: manual file upload
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setStatus("Reading file...", "text-yellow-400");

                const reader = new FileReader();
                reader.onload = (event) => loadSVGText(event.target.result);
                reader.onerror = () => setStatus("Error reading file.", "text-red-500");
                reader.readAsText(file);
            });

            function processSVG(svg) {
                try {
                    // Gather all visual elements
                    const allElements = Array.from(svg.querySelectorAll('path, rect, polygon, circle, ellipse, polyline, line'));
                    
                    // 1. Find elements that are red (checking fill and stroke)
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    let hasRedElements = false;

                    const redElements = allElements.filter(el => {
                        let fill = el.getAttribute('fill') || el.style.fill || '';
                        if (!fill || fill === 'none') {
                            const comp = window.getComputedStyle(el).fill;
                            if (comp && comp !== 'none') fill = comp;
                        }
                        
                        let stroke = el.getAttribute('stroke') || el.style.stroke || '';
                        if (!stroke || stroke === 'none') {
                            const compStroke = window.getComputedStyle(el).stroke;
                            if (compStroke && compStroke !== 'none') stroke = compStroke;
                        }

                        return isColorRed(fill) || isColorRed(stroke);
                    });

                    if (redElements.length === 0) {
                        // FALLBACK: Manual Click to Animate
                        statusMsg.textContent = "No red elements detected. Click the door in the image to animate it.";
                        statusMsg.className = "mb-4 text-sm font-medium text-yellow-400 h-6";
                        
                        const clickHandler = (e) => {
                            if (doorGroup) return; // Already animating something
                            let target = e.target;
                            if (target === svg) return; // Clicked background
                            
                            // Try to get the closest group, otherwise use the element itself
                            target = target.closest('g') || target;
                            
                            const bbox = target.getBBox();
                            const originX = bbox.x + bbox.width; // Right edge
                            const originY = bbox.y + (bbox.height / 2);
                            
                            target.style.transformOrigin = `${originX}px ${originY}px`;
                            armDoor(target);
                            doorGroup = target;
                            
                            statusMsg.textContent = "Manual door selection animated.";
                            statusMsg.className = "mb-4 text-sm font-medium text-green-400 h-6";
                            svg.removeEventListener('click', clickHandler);
                        };
                        svg.addEventListener('click', clickHandler);
                        return; // Exit auto-process
                    }

                    // 2. Calculate the bounding box union for all red elements (the door body)
                    redElements.forEach(el => {
                        try {
                            const bbox = el.getBBox();
                            if (bbox.width > 0 && bbox.height > 0) {
                                minX = Math.min(minX, bbox.x);
                                minY = Math.min(minY, bbox.y);
                                maxX = Math.max(maxX, bbox.x + bbox.width);
                                maxY = Math.max(maxY, bbox.y + bbox.height);
                                hasRedElements = true;
                            }
                        } catch (e) { /* Ignore elements that fail getBBox */ }
                    });

                    if (!hasRedElements) {
                        throw new Error("Could not calculate dimensions for the red door components.");
                    }

                    // 3. Find *all* elements (like black frames, handle, lines) that belong to the door
                    // We do this by checking if they fall within the red bounding box + a small tolerance
                    const tolerance = 5; 
                    const doorParts = allElements.filter(el => {
                        try {
                            const bbox = el.getBBox();
                            return (
                                bbox.width > 0 && bbox.height > 0 &&
                                bbox.x >= minX - tolerance &&
                                bbox.y >= minY - tolerance &&
                                (bbox.x + bbox.width) <= maxX + tolerance &&
                                (bbox.y + bbox.height) <= maxY + tolerance
                            );
                        } catch (e) {
                            return false;
                        }
                    });

                    // 4. Create a group (<g>) for animation
                    doorGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    doorGroup.id = "animated-door-group";

                    // Insert the group before the first door element to maintain rendering (z-index) order as best as possible
                    if (doorParts.length > 0) {
                        const firstPart = doorParts[0];
                        firstPart.parentNode.insertBefore(doorGroup, firstPart);
                        // Move all identified parts into the new group
                        doorParts.forEach(part => doorGroup.appendChild(part));
                    }

                    // 5. Calculate transform origin (Right Edge = Hinge)
                    // We base this on the exact computed bounding box of our newly assembled group.
                    const groupBBox = doorGroup.getBBox();
                    
                    // armDoor hinges it on the right edge of this box
                    armDoor(doorGroup);
                    doorHeightUnits = groupBBox.height;
                    layout();

                    // Initialization complete
                    statusMsg.textContent = "Door isolated successfully. Click it to open.";
                    statusMsg.className = "mb-4 text-sm font-medium text-green-400 h-6";

                } catch (error) {
                    console.error("Error processing SVG elements:", error);
                    statusMsg.textContent = `Processing Error: ${error.message}`;
                    statusMsg.className = "mb-4 text-sm font-medium text-red-500 h-6";
                }
            }
        });
    </script>
</body>
</html>
